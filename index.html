<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="csp-nonce" content="__CSP_NONCE__" />
    <link rel="icon" type="image/webp" href="/assets/images/techietribe_logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A platform with finest local business listings available in your city"
    />

    <link
      rel="preload"
      as="image"
      href="/assets/publicAssets/images/home/Education.webp"
      fetchpriority="high"
    />

    <style>
      #startup-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        background: #0a0a0a;
        color: #fff;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        pointer-events: none;
      }

      .startup-shell__nav {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
      }

      .startup-shell__nav img {
        width: clamp(145px, 15vw, 180px);
        height: auto;
      }

      .startup-shell__hero {
        min-height: 100vh;
        padding: 140px 16px 40px;
        text-align: center;
        background:
          linear-gradient(to top, rgba(0, 0, 0, 1), rgba(0, 0, 0, 0.3)),
          #0a0a0a;
      }

      .startup-shell__hero p {
        margin: 0;
        font-weight: 600;
        letter-spacing: 0.18em;
        opacity: 0.9;
      }

      .startup-shell__hero h1 {
        max-width: 900px;
        margin: 24px auto 0;
        color: #fff;
        font-size: clamp(2rem, 7vw, 4.1rem);
        font-weight: 500;
        line-height: 1.15;
      }

      .startup-shell__button {
        display: inline-flex;
        margin-top: 24px;
        border-radius: 999px;
        padding: 14px 34px;
        background: #fff;
        color: #000;
        font-size: 16px;
        font-weight: 700;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }

      .startup-shell__card {
        position: relative;
        width: min(88vw, 740px);
        height: min(300px, 67.7vw);
        margin: 56px auto 0;
        overflow: hidden;
        border-radius: 24px;
        background: #0e0e0e;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
      }

      .startup-shell__card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .startup-shell__label {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 40px 24px 24px;
        text-align: left;
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
      }

      @media (min-width: 900px) {
        #startup-shell {
          display: none;
        }
      }
    </style>

    <title>Techietribe</title>
  </head>
  <body>
    <div id="startup-shell" aria-hidden="true">
      <div class="startup-shell__nav">
        <img src="/WhiteLogo.png" alt="" width="180" height="35" />
      </div>
      <section class="startup-shell__hero">
        <p>THE FASTEST WAY TO GO ONLINE</p>
        <h1>Create a <strong>Free</strong> Landing Page for Your Business Instantly.</h1>
        <div class="startup-shell__button">Sign Up to Build</div>
        <div class="startup-shell__card">
          <img
            src="/assets/publicAssets/images/home/Education.webp"
            alt=""
            width="740"
            height="520"
            fetchpriority="high"
          />
          <div class="startup-shell__label">Education</div>
        </div>
      </section>
    </div>
    <div id="app-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
